<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sujumayas</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Tag Manager -->
    <script>(function (w, d, s, l, i) {
            w[l] = w[l] || []; w[l].push({
                'gtm.start':
                    new Date().getTime(), event: 'gtm.js'
            }); var f = d.getElementsByTagName(s)[0],
                j = d.createElement(s), dl = l != 'dataLayer' ? '&l=' + l : ''; j.async = true; j.src =
                    'https://www.googletagmanager.com/gtm.js?id=' + i + dl; f.parentNode.insertBefore(j, f);

            style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->
    <div id="app">
        <div class="container">
            <h1 class="topics-title">Choose your topic</h1>
            <div class="topics-container">
                <template v-for="topicGroup, key in topics">
                    <div @click="chooseTopic(topic)" :class="{'selected':topic.isSelected}" class="topic" v-for="topic in topicGroup">
                        <span>{{topic.title}}</span>
                        <div :class="{'selected':topic.isSelected & modal.isActive}" class="poem modal">
                            <span @click.stop="deActivateModal()">X</span>
                            <pre>
                                {{topic.poem}}
                            </pre>
                        </div>
                    </div>
                </template>
            </div>
            <div>
                
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/vue@2"></script>
    <script type="module" src="app.js"></script>
</body>
</html>
